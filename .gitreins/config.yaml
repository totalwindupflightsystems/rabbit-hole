guards:
  # CLN-002: board-only commits (and any diff with no staged .go file) make
  # the Go gates report "No Go files staged", which TRUST-001 grades as a
  # DEGRADED PASS and the CLI turns into exit 2 — the pre-commit hook then
  # refuses the commit, so every board write needed a --no-verify bypass.
  # Opting into skips keeps the exit code honest for the zero-work case while
  # a real gate FAILURE (go build/lint/tests, secrets) still exits 1 and is
  # still refused; hook timeouts (exit 2) are unaffected by this key.
  allow_skips: true
  secrets: true
  lint: false
  tests: false
  test_mode: full
  go:
    build: true
    lint: true
    tests: true
evaluator:
  max_iterations: 200
  max_time: 25m
  max_input_tokens: 2M
  max_output_tokens: 0.4M
  tool_call_weight: 0.1
  fast_track: auto

defaults:
  model: deepseek-v4-flash
  provider: deepseek-foreman
  api_key_env: GITREINS_LLM_API_KEY

history:
  enabled: true
  storage: git
  max_verdicts: 1000

pipeline:
  stages:
    - id: tier1
      parallel: true
      on: [pre-commit, pre-eval]
      steps:
        - id: guard
          type: script
          run: "gitreins guard"
          on_fail: block
    - id: tier2
      type: ai_eval
      on: [pre-eval]
      condition: "true"
      max_iterations: 200
      max_time: 25m
      tools: [read_file, run_command, search_pattern, read_diff, sandbox, detect_dead_code]

