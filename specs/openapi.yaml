openapi: 3.1.0
info:
  title: Rabbit-Hole Expression Server API
  version: 1.0.0
  summary: HTTP and WebSocket interface for the Rabbit-Hole EXPRESS layer.
  description: |
    Rabbit-Hole makes AI-agent activity legible. This API is the EXPRESS layer
    over COLLECT telemetry and CLASSIFY semantic flows: it provides health and
    Prometheus observability, session and flow retrieval, structured search,
    natural-language chat, and live flow streaming.

    This contract implements the expression-layer design in
    [S04 — Expression Layer](./04-Expression-Layer.md). Persistent objects and
    their relationships are defined by [S05 — Storage & Data Model](./05-Storage-Data-Model.md).

    Authentication is opt-in. When `RABBITHOLE_API_KEY` is unset, the server
    permits every request. When it is set, routes marked with `ApiKeyAuth`
    require the exact key in the `X-API-Key` header. `/health`, `/metrics`, and
    `/api/v1/metrics` remain public for health probes and Prometheus scrapers.
  contact:
    name: Rabbit-Hole
    url: https://gitlab.readydedis.com/rabbit-hole/rabbit-hole
  license:
    name: MIT
    url: https://opensource.org/license/mit
servers:
  - url: http://127.0.0.1:9734
    description: Default local expression server (RABBITHOLE_LISTEN_ADDR)
    variables: {}
tags:
  - name: Health
    description: Liveness and component-health reporting.
  - name: Metrics
    description: Prometheus-format runtime and application metrics.
  - name: Sessions
    description: Monitored agent sessions.
  - name: Flows
    description: Semantic units of agent activity produced by CLASSIFY.
  - name: Search
    description: Full-text and structured flow search.
  - name: Chat
    description: Natural-language queries over agent activity.
  - name: Streaming
    description: Real-time flow events over WebSocket.
  - name: Dashboard
    description: Aggregate overview metrics and the embedded dashboard SPA.
  - name: Admin
    description: Daemon statistics, maintenance, and demo-data operations driven by the CLI.

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Get server and component health
      description: |
        Returns overall health plus one entry per probed component. `storage`
        and `metrics` are probed by a normally initialized server; `classifier`
        and `collector` are probed only when the serve command registers them.
        Components that were never registered are omitted from `components`
        and never influence the top-level status. The HTTP status is `200` for
        both an `ok` and a `degraded` report; the verdict is carried in the
        body.

        Top-level status rule (exactly as implemented): the top-level `status`
        is `degraded` when ANY probed component's `status` string does not begin
        with the token `ok`, and `ok` only when every probed component's status
        string begins with `ok`. The test is a prefix test over the whole status
        string, not equality against `ok` and not a check for the literal
        `error`: anything that does not lead with `ok` degrades the response,
        including a status that leads with `degraded`, a status that leads with
        `error`, and any other value. Any human-readable suffix after the token
        (for example `ok — gemma via ollama …`) does not change the verdict.
        Conversely, a status that begins with `ok` never degrades the response,
        even when its `detail` describes a loss of function — `detail` is
        informational and is never consulted for the verdict.

        Observed component status strings:

        - `classifier` (status probe, reports the effective backend mode):
          `degraded — pattern-only (no model loaded)` when no backend is
          configured; `degraded — pattern-only (model not loaded)` when a
          configured model is not loaded, with `detail`
          `gemma load failed: <err>` if a load error was recorded and an empty
          `detail` otherwise; `ok — gemma via ollama <url>` with `detail`
          `model <name> loaded` when the local model is loaded;
          `ok — remote gRPC <endpoint>` or `degraded — remote gRPC <endpoint>`
          for a remote backend, depending on whether it is reachable. Both
          pattern-only values and the degraded remote value degrade the
          response: a classifier running on deterministic pattern matching
          instead of a model is never reported as `ok`.
        - `collector` (check probe; the check inspects ring-buffer health): `ok`
          with `detail` `eBPF probes attached` when probes are attached, or `ok`
          with `detail` `eBPF degraded — telemetry DISABLED` when kernel
          telemetry is unavailable (`--no-ebpf`, `--demo-stream`, missing
          capabilities, unsupported kernel). That detail is informational and
          the status still begins with `ok`, so degraded telemetry on its own
          does not degrade the response. The status becomes `error` with
          `detail` `ring buffer overflow: <n> traces dropped` when the ring
          buffer has dropped more than 100,000 traces, which does degrade the
          response. A host where eBPF probes cannot be loaded at all and
          neither `--no-ebpf` nor `--demo-stream` was passed never serves
          `/health`: `serve` exits with the preflight error
          (`eBPF unavailable — telemetry DISABLED (requires CAP_SYS_RESOURCE and
          kernel 5.11+; use --no-ebpf to run in degraded mode): …`), so that
          condition is a startup failure rather than a component status.
        - `storage`: `ok` when the store health check passes, otherwise `error`
          with the store's error text as `detail`.
        - `metrics`: `ok` with `detail` `runtime gauges active`, or `error`
          with `detail` `registry not initialized`.

        The distinguishing case is deliberate: a `collector` with eBPF disabled
        reports `ok` because the component works but is not collecting, while a
        `classifier` on pattern matching reports `degraded` because
        classification is silently weaker than configured. A consumer should
        therefore read the leading token of each component status, not the
        `detail` text, to predict the top-level status.
      security: []
      responses:
        '200':
          description: Health report.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/CorsAllowOrigin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                degraded:
                  summary: >-
                    Captured from a live server started with --no-ebpf and a
                    throwaway DB: a pattern-only classifier degrades the
                    top-level status while every other probed component is ok.
                  value:
                    status: degraded
                    version: v1.0.0-dev
                    uptime: 8.023704479s
                    components:
                      classifier:
                        status: 'degraded — pattern-only (model not loaded)'
                        detail: 'gemma load failed: classification model not loaded'
                      collector:
                        status: ok
                        detail: 'eBPF degraded — telemetry DISABLED'
                      metrics:
                        status: ok
                        detail: runtime gauges active
                      storage:
                        status: ok
                allOk:
                  summary: >-
                    Every probed component's status begins with ok, so the
                    top-level status is ok. The collector detail shows the
                    ok-prefixed telemetry-disabled state.
                  value:
                    status: ok
                    version: v1.0.0-dev
                    uptime: 5h30m15s
                    components:
                      classifier:
                        status: 'ok — gemma via ollama http://127.0.0.1:11434'
                        detail: 'model gemma3:4b loaded'
                      collector:
                        status: ok
                        detail: 'eBPF probes attached'
                      metrics:
                        status: ok
                        detail: runtime gauges active
                      storage:
                        status: ok
        '500':
          $ref: '#/components/responses/InternalServerError'

  /metrics:
    get:
      tags: [Metrics]
      operationId: getMetrics
      summary: Get Prometheus metrics
      description: |
        Exposes the server's dedicated Prometheus registry in text exposition
        format. This endpoint bypasses API-key authentication and rate limiting.
      security: []
      responses:
        '200':
          description: Prometheus text exposition data.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/CorsAllowOrigin'
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP rabbit_hole_goroutines Number of goroutines that currently exist.
                # TYPE rabbit_hole_goroutines gauge
                rabbit_hole_goroutines 42
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/metrics:
    get:
      tags: [Metrics]
      operationId: getMetricsV1
      summary: Get Prometheus metrics (API v1 alias)
      description: |
        Alias of `GET /metrics`; it uses the same Prometheus handler and has
        identical authentication and rate-limit bypass behavior.
      security: []
      responses:
        '200':
          description: Prometheus text exposition data.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/CorsAllowOrigin'
          content:
            text/plain:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/sessions:
    get:
      tags: [Sessions]
      operationId: listSessions
      summary: List monitored sessions
      description: |-
        Returns paginated session summaries. `total` is the number of sessions
        matching the request, not the number of summaries on this page, so a
        client can page through every result. The server defaults `offset` to 0
        and `limit` to 20, and caps `limit` at 100.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/SessionListLimit'
      responses:
        '200':
          description: Paginated session summaries.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/CorsAllowOrigin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/sessions/{id}:
    get:
      tags: [Sessions]
      operationId: getSession
      summary: Get a monitored session
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Full session object, including sanitized process metadata.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/CorsAllowOrigin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/sessions/attach:
    post:
      tags: [Sessions]
      operationId: attachSession
      summary: Attach the daemon collector to an agent process
      description: |
        Starts a session on the daemon's collector and persists it, so the
        session outlives the CLI invocation that requested it and is visible
        immediately to `GET /api/v1/sessions`, `rabbit-hole list`, and
        `rabbit-hole status`.

        The endpoint exists only when the `serve` command has wired a session
        manager onto the server; otherwise it answers `503`
        (`session management unavailable — no daemon wired`).

        A request that does not set `no_ebpf` promises kernel telemetry. When
        the collector is degraded, attach fails with `403` instead of starting
        a silently weaker session, which is the HTTP form of the `attach`
        preflight: send `no_ebpf: true` to opt into degraded mode explicitly
        (the CLI's `--no-ebpf`).

        `400` covers a body that is not decodable JSON and a non-positive
        `pid`; a PID the daemon is already monitoring is `409`; a PID that does
        not exist is `404`.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachSessionRequest'
            example:
              pid: 12345
              context_windows: false
              categories: [syscall, network]
              tls_interception: false
              no_ebpf: false
      responses:
        '201':
          description: Session created on the daemon collector and persisted.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/CorsAllowOrigin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionLifecycleSummary'
              example:
                id: 0191a000-0000-7000-8000-000000000001
                agent_pid: 12345
                agent_name: hermes
                command_line: hermes chat
                start_time: '2026-07-21T12:00:00Z'
                end_time: null
                status: running
        '400':
          description: Request body is not valid JSON, or `pid` is zero or negative.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidBody:
                  value: {error: 'invalid attach request: invalid character ''x'' looking for beginning of value'}
                invalidPID:
                  value: {error: pid must be a positive integer}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            eBPF preflight failed: kernel telemetry is unavailable and the
            request did not opt into degraded mode with `no_ebpf`.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'eBPF unavailable — telemetry DISABLED (use --no-ebpf to run in degraded mode): operation not permitted'
        '404':
          description: No process with the requested PID exists.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example: {error: 'process 12345 not found'}
        '409':
          description: The daemon is already monitoring that PID.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example: {error: 'already attached to process 12345'}
        '500':
          description: The collector failed to start the session.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example: {error: failed to attach session}
        '503':
          description: >-
            The server was started without a daemon-side session manager, so
            session lifecycle endpoints are unavailable.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example: {error: 'session management unavailable — no daemon wired'}

  /api/v1/sessions/{id}/detach:
    post:
      tags: [Sessions]
      operationId: detachSession
      summary: Detach the collector from a session and complete it
      description: |
        Stops tracing the session on the daemon's collector and marks it
        `completed` in the store, so `rabbit-hole detach <id>` leaves no stuck
        `running` row behind.

        A session that is persisted but no longer known to the collector (for
        example the daemon restarted after the attach) is completed in storage
        anyway, so a detach always lands and a session is never undetachable
        because of a daemon lifetime.

        There is no request body. The response carries the session id and its
        terminal status, which is always `completed`. `404` means the id is
        unknown both to the collector and to the store; `503` means the server
        has no session manager wired.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Session detached and marked completed.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/CorsAllowOrigin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetachSessionResponse'
              example:
                id: 0191a000-0000-7000-8000-000000000001
                status: completed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The session id is unknown to both the collector and the store.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example: {error: 'session 0191a000-0000-7000-8000-000000000001 not found'}
        '500':
          description: The collector failed to stop the session.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example: {error: failed to detach session}
        '503':
          description: >-
            The server was started without a daemon-side session manager, so
            session lifecycle endpoints are unavailable.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example: {error: 'session management unavailable — no daemon wired'}

  /api/v1/stats:
    get:
      tags: [Admin]
      operationId: getStats
      summary: Get daemon aggregate statistics
      description: |
        Aggregates the daemon's store and runtime for `rabbit-hole status`.
        Every field describes the process that owns the database, never the
        CLI's local configuration:

        - `db_path` is the SQLite file the daemon has open.
        - `listen_addr` is the `listen_addr` metadata row the `serve` command
          writes at startup; when that row is absent (a test server, or a
          database written by an older build) it falls back to the address the
          server is actually bound to.
        - `active_sessions` counts stored sessions whose status is `running`,
          over a scan of up to 10000 sessions.
        - `oldest_trace` is omitted when the store holds no traces.
        - `log_level`, `ebpf_enabled`, and `ebpf_detail` are the runtime facts
          the `serve` command registers; a server that registered none reports
          an empty `log_level` and `ebpf_enabled: false`.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Daemon storage and runtime aggregates.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/CorsAllowOrigin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaemonStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: A storage read failed while assembling the report.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                storageFailed:
                  value: {error: failed to read storage stats}
                sessionsFailed:
                  value: {error: failed to list sessions}

  /api/v1/compact:
    post:
      tags: [Admin]
      operationId: compactStore
      summary: Delete daemon data older than a cutoff
      description: |
        Deletes data older than `cutoff` from the daemon's own store. The CLI
        parses its human duration (`rabbit-hole compact --older-than 30d`) and
        sends the already-resolved RFC3339 cutoff, so the server never
        interprets duration strings — and never compacts a SQLite file the
        daemon does not own, because the CLI never opens the database itself.

        The response echoes the cutoff normalized to UTC in RFC3339 form, so a
        caller can log exactly what was applied. `400` covers an undecodable
        body, an absent `cutoff`, and a `cutoff` that is not RFC3339; `500`
        carries the store's error text.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompactRequest'
            example:
              cutoff: '2026-08-01T00:00:00Z'
      responses:
        '200':
          description: Data older than the cutoff was deleted.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/CorsAllowOrigin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompactResponse'
              example:
                cutoff: '2026-08-01T00:00:00Z'
        '400':
          description: >-
            Undecodable request body, absent `cutoff`, or a `cutoff` that is
            not an RFC3339 timestamp.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidBody:
                  value: {error: 'invalid request body: invalid character ''x'' looking for beginning of value'}
                missingCutoff:
                  value: {error: cutoff is required (RFC3339 timestamp)}
                invalidCutoff:
                  value: {error: 'invalid cutoff: parsing time "yesterday" as "2006-01-02T15:04:05Z07:00": cannot parse "yesterday" as "2006"'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: The store rejected the delete.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example: {error: 'compact failed: database is locked'}

  /api/v1/demo/seed:
    post:
      tags: [Admin]
      operationId: seedDemo
      summary: Seed a realistic demo session
      description: |
        Generates a realistic dogfood session — flows, synthetic traces, and
        context windows on the `llm_api_call` and `patch_code` flows — and
        persists it through the daemon's store, so `rabbit-hole demo` never
        leaves phantom data the dashboard, chat, and search cannot see.

        Defaults, applied when a field is absent or not positive (`<= 0`):
        `flows` 48, `hours_back` 3. With `spread: true` the flows are
        distributed across the whole `hours_back` window; otherwise they
        cluster at its start.

        The seeded session is stored `running` while its traces are written
        (trace storage resolves the session from the PID by `running` status,
        and a `completed` session would orphan them on a foreign key) and is
        finalized to `completed` before the response, so `session_id` names a
        completed session.

        A request body is required even when every field is defaulted — send
        `{}` — because the body is decoded before the defaults are applied; an
        empty body is `400`.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoSeedRequest'
            example:
              flows: 48
              hours_back: 3
              spread: true
      responses:
        '200':
          description: Demo session seeded and finalized as completed.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/CorsAllowOrigin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoSeedResponse'
              example:
                session_id: 0191a000-0000-7000-8000-000000000001
        '400':
          description: Request body is not valid JSON (including an empty body).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                emptyBody:
                  value: {error: 'invalid request body: EOF'}
                invalidBody:
                  value: {error: 'invalid request body: invalid character ''x'' looking for beginning of value'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: >-
            A seed step failed. The message names the step — `failed to store
            session`, `failed to store flows`, `failed to store traces`,
            `failed to store context window`, or `failed to finalize session` —
            followed by the store's error text.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                storeSession:
                  value: {error: 'failed to store session: UNIQUE constraint failed: sessions.id'}
                storeFlows:
                  value: {error: 'failed to store flows: database is locked'}

  /api/v1/flows/{id}:
    get:
      tags: [Flows]
      operationId: getFlow
      summary: Get a semantic flow
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/FlowId'
      responses:
        '200':
          description: Full semantic flow, optionally including its captured context window.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/CorsAllowOrigin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/FlowNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/flows/{id}/context-window:
    get:
      tags: [Flows]
      operationId: getContextWindow
      summary: Get a flow's captured context window
      description: |
        Returns the LLM context captured at the flow's decision point. Context
        capture is optional and disabled by default because it can be expensive.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/FlowId'
      responses:
        '200':
          description: Captured context window.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/CorsAllowOrigin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextWindow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ContextWindowNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/search:
    post:
      tags: [Search]
      operationId: searchFlows
      summary: Search flows with full-text or structured filters
      description: |
        Searches FTS5 when `query` is supplied. With an empty query, the server
        applies the structured filters and cursor pagination. Search execution
        has a 30-second deadline. This endpoint is rate-limited by client IP
        and endpoint using a token bucket.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            example:
              query: read auth.go
              session_id: 0191a000-0000-7000-8000-000000000001
              time_range:
                start: '2026-07-21T00:00:00Z'
                end: '2026-07-21T23:59:59Z'
              categories: [action]
              outcomes: [success, failure]
              limit: 50
              cursor: ''
              include_context_windows: false
      responses:
        '200':
          description: Matching flows and pagination state.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/CorsAllowOrigin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/InvalidRequestBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '504':
          $ref: '#/components/responses/SearchTimedOut'

  /api/v1/chat:
    post:
      tags: [Chat]
      operationId: chat
      summary: Ask a natural-language question about agent activity
      description: |
        The chat model translates the message into a search, retrieves relevant
        flows, generates a natural-language answer, and adds follow-up
        suggestions. If answer generation fails, the server returns a
        structured fallback answer. This endpoint is rate-limited by client IP
        and endpoint using a token bucket.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
            example:
              message: What did helios do at 3am?
              session_id: 0191a000-0000-7000-8000-000000000001
      responses:
        '200':
          description: Natural-language answer, supporting flows, and suggestions.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/CorsAllowOrigin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Invalid JSON request body or empty message.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidBody:
                  value: {error: 'invalid request body: unexpected end of JSON input'}
                missingMessage:
                  value: {error: message is required}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/ws/sessions/{id}:
    get:
      tags: [Streaming]
      operationId: streamSessionFlows
      summary: Stream real-time flows for a session over WebSocket
      description: |
        Initiate an HTTP WebSocket upgrade using gorilla/websocket. Include
        `X-API-Key` in the initial HTTP upgrade request. After a successful
        `101 Switching Protocols` response, the server sends one complete
        `Flow` JSON object per text message whenever a flow is published for
        the session. The endpoint is rate-limited by client IP and endpoint.

        The server sends a WebSocket Ping control message every 30 seconds. The
        client must answer with Pong control messages; the read deadline is 60
        seconds and is extended after every Pong. When the subscription channel
        closes, the server sends a normal WebSocket close frame with reason
        `session ended`.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: Connection
          in: header
          required: true
          description: Must be `Upgrade` for the initial WebSocket request.
          schema: {type: string, example: Upgrade}
        - name: Upgrade
          in: header
          required: true
          description: Must be `websocket` for the initial WebSocket request.
          schema: {type: string, example: websocket}
        - name: Sec-WebSocket-Key
          in: header
          required: true
          description: Client-generated WebSocket handshake key.
          schema: {type: string}
        - name: Sec-WebSocket-Version
          in: header
          required: true
          description: WebSocket protocol version.
          schema: {type: string, example: '13'}
      responses:
        '101':
          description: |
            WebSocket upgrade accepted. Each subsequent text message is a JSON
            `Flow` object. The server sends Ping every 30 seconds and a normal
            close frame with `session ended` when the stream ends.
          headers:
            Upgrade:
              schema: {type: string, example: websocket}
            Connection:
              schema: {type: string, example: Upgrade}
            Sec-WebSocket-Accept:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-websocket:
        subprotocol: none
        messageType: text
        messageSchema:
          $ref: '#/components/schemas/Flow'
        pingInterval: PT30S
        pongTimeout: PT60S
        closeReason: session ended

  /dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Dashboard SPA
      description: |
        Serves the embedded single-page dashboard (a New Relic-style trace
        explorer) as HTML. The SPA reads live data from
        `GET /api/v1/dashboard/summary`.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Dashboard SPA HTML.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/CorsAllowOrigin'
          content:
            text/html:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/dashboard/summary:
    get:
      tags: [Dashboard]
      operationId: getDashboardSummary
      summary: Get dashboard aggregate summary
      description: |
        Returns the aggregate metrics the dashboard overview page renders:
        totals, error count, average duration, and breakdowns by phase,
        outcome and UTC hour, plus the most common intents and the most
        recent flows.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Dashboard overview aggregates.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/CorsAllowOrigin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        API key configured through `RABBITHOLE_API_KEY`. Authentication is
        enforced only when that environment variable is non-empty.

  headers:
    RequestId:
      description: Request correlation ID. Echoes the incoming `X-Request-ID` or is generated as a UUID v7.
      schema:
        type: string
        format: uuid
    CorsAllowOrigin:
      description: CORS middleware currently allows all origins.
      schema:
        type: string
        example: '*'

  parameters:
    Offset:
      name: offset
      in: query
      description: Zero-based number of sessions to skip. Defaults to 0.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    SessionListLimit:
      name: limit
      in: query
      description: Maximum number of session summaries. Defaults to 20; values greater than 100 are capped by the server.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    SessionId:
      name: id
      in: path
      required: true
      description: UUID v7 that identifies a monitored agent session.
      schema:
        $ref: '#/components/schemas/UUIDv7'
    FlowId:
      name: id
      in: path
      required: true
      description: UUID v7 that identifies a semantic flow.
      schema:
        $ref: '#/components/schemas/UUIDv7'

  responses:
    InvalidRequestBody:
      description: Request JSON could not be decoded.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: 'invalid request body: unexpected end of JSON input'}
    Unauthorized:
      description: API key is missing or does not match `RABBITHOLE_API_KEY`.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: unauthorized}
    SessionNotFound:
      description: The requested session does not exist.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: session not found}
    FlowNotFound:
      description: The requested flow does not exist.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: flow not found}
    ContextWindowNotFound:
      description: Context windows are optional, and none is available for this flow.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: 'context window not available — may not have been captured'}
    RateLimitExceeded:
      description: Per-IP, per-endpoint token bucket has no available tokens.
      headers:
        Retry-After:
          description: Number of seconds to wait before retrying.
          schema: {type: integer, minimum: 1}
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RateLimitErrorResponse'}
          example: {error: rate limit exceeded, retry_after: 30}
    SearchTimedOut:
      description: Search exceeded its 30-second execution deadline.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: 'search timed out — try narrowing your query'}
    InternalServerError:
      description: Unexpected server failure.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: internal server error}

  schemas:
    UUIDv7:
      type: string
      format: uuid
      description: UUID version 7 identifier.
      examples: ['0191a000-0000-7000-8000-000000000001']

    RFC3339Timestamp:
      type: string
      format: date-time
      description: UTC timestamp encoded as RFC 3339/RFC 3339 Nano text.
      examples: ['2026-07-21T12:00:00Z']

    GoDuration:
      type: string
      description: Go `time.Duration` string.
      pattern: '^-?(?:[0-9]+(?:\.[0-9]+)?(?:ns|us|µs|ms|s|m|h))+$'
      examples: [2s, 1.5s, 5h30m15s]

    DurationNanoseconds:
      type: integer
      format: int64
      minimum: 0
      description: |
        Duration encoded as integer nanoseconds — the JSON wire encoding Go's
        `time.Duration` marshals to (json.Marshal of time.Duration emits the
        raw nanosecond count). Used for Flow.duration and
        ContextWindow.duration; GoDuration (string form) remains for fields
        such as HealthResponse.uptime that are emitted via String().
      example: 1200000000

    FlowPhase:
      type: string
      description: Stage in the agent decision cycle (`types.FlowPhase`).
      enum: [observation, deliberation, action, verification]

    FlowOutcome:
      type: string
      description: Result of a semantic flow (`types.FlowOutcome`).
      enum: [success, failure, timeout, unknown]

    SessionStatus:
      type: string
      description: Lifecycle state of a monitored session (`types.SessionStatus`).
      enum: [running, completed, crashed, killed]

    ComponentStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          description: |
            Component status string. Only its prefix is load-bearing: the
            top-level health status is `degraded` when this value does not begin
            with the token `ok`, and `ok` only when every probed component's
            value begins with `ok`. The value may carry a machine token plus a
            human-readable suffix after it (for example
            `ok — gemma via ollama http://127.0.0.1:11434`,
            `degraded — pattern-only (model not loaded)`, or
            `error`), which is why this field is intentionally open-ended
            rather than a closed enum — new component probes may introduce new
            suffix text. The observed values per component are listed in the
            `GET /health` operation description.
          examples:
            - ok
            - 'ok — gemma via ollama http://127.0.0.1:11434'
            - 'degraded — pattern-only (model not loaded)'
            - error
        detail:
          type: string
          description: |
            Optional diagnostic text supplied by the component probe. It is
            informational only and is never consulted when computing the
            top-level status, so an `ok`-prefixed status can still carry a
            detail that describes lost functionality (for example
            `eBPF degraded — telemetry DISABLED` on an `ok` collector).

    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, version, uptime, components]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          description: Server version; currently `1.0.0`.
          example: 1.0.0
        uptime:
          $ref: '#/components/schemas/GoDuration'
        components:
          type: object
          description: |
            Component name to health result, one entry per probed component.
            `storage` and `metrics` are always reported by a normally
            initialized server; dynamically registered component names include
            `classifier` and `collector`. Unregistered components are omitted.
            The top-level `status` is `degraded` when any entry's `status` does
            not begin with `ok`; see the `GET /health` operation description
            for the rule and the observed status strings per component.
          additionalProperties:
            $ref: '#/components/schemas/ComponentStatus'
          example:
            storage: {status: ok}
            metrics: {status: ok, detail: runtime gauges active}
            classifier: {status: 'ok — gemma via ollama http://127.0.0.1:11434', detail: 'model gemma3:4b loaded'}
            collector: {status: ok, detail: 'eBPF degraded — telemetry DISABLED'}

    SessionMetadata:
      type: object
      additionalProperties: false
      required: [command_line, environment, work_dir, binary_path, version]
      properties:
        command_line:
          type: string
          description: Full command line of the monitored agent process.
        environment:
          type: object
          description: Sanitized environment map; secrets should be redacted before persistence.
          additionalProperties:
            type: string
          example: {OPENAI_API_KEY: '***'}
        work_dir:
          type: string
        binary_path:
          type: string
        version:
          type: string
      example:
        command_line: hermes chat
        environment: {OPENAI_API_KEY: '***'}
        work_dir: /home/kara
        binary_path: /usr/local/bin/hermes
        version: 0.18.2

    Session:
      type: object
      additionalProperties: false
      required: [id, agent_pid, agent_name, start_time, status, metadata]
      properties:
        id:
          $ref: '#/components/schemas/UUIDv7'
        agent_pid:
          type: integer
          format: int32
          description: Operating-system PID of the monitored agent process.
          example: 12345
        agent_name:
          type: string
          examples: [hermes, codex, claude-code]
        start_time:
          $ref: '#/components/schemas/RFC3339Timestamp'
        end_time:
          anyOf:
            - $ref: '#/components/schemas/RFC3339Timestamp'
            - type: 'null'
          description: Null while the session is running.
        status:
          $ref: '#/components/schemas/SessionStatus'
        metadata:
          $ref: '#/components/schemas/SessionMetadata'
      example:
        id: 0191a000-0000-7000-8000-000000000001
        agent_pid: 12345
        agent_name: hermes
        start_time: '2026-07-21T12:00:00Z'
        end_time: null
        status: running
        metadata:
          command_line: hermes chat
          environment: {OPENAI_API_KEY: '***'}
          work_dir: /home/kara
          binary_path: /usr/local/bin/hermes
          version: 0.18.2

    SessionSummary:
      type: object
      additionalProperties: false
      required: [id, agent_pid, agent_name, start_time, status]
      properties:
        id: {$ref: '#/components/schemas/UUIDv7'}
        agent_pid: {type: integer, format: int32}
        agent_name: {type: string}
        start_time: {$ref: '#/components/schemas/RFC3339Timestamp'}
        end_time:
          anyOf:
            - $ref: '#/components/schemas/RFC3339Timestamp'
            - type: 'null'
        status: {$ref: '#/components/schemas/SessionStatus'}
        metadata:
          $ref: '#/components/schemas/SessionMetadata'

    SessionListResponse:
      type: object
      additionalProperties: false
      required: [sessions, total, offset, limit]
      properties:
        sessions:
          type: array
          items: {$ref: '#/components/schemas/SessionSummary'}
        total:
          type: integer
          format: int32
          minimum: 0
          description: >-
            Total number of sessions matching the request, independent of
            `offset` and `limit`. The `sessions` array holds at most `limit` of
            them.
        offset:
          type: integer
          format: int32
          minimum: 0
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
      example:
        sessions:
          - id: 0191a000-0000-7000-8000-000000000001
            agent_pid: 12345
            agent_name: hermes
            start_time: '2026-07-21T12:00:00Z'
            end_time: null
            status: running
            metadata:
              command_line: hermes chat
              environment: {OPENAI_API_KEY: '***'}
              work_dir: /home/kara
              binary_path: /usr/local/bin/hermes
              version: 0.18.2
        total: 1
        offset: 0
        limit: 20

    AttachSessionRequest:
      type: object
      additionalProperties: false
      required: [pid]
      properties:
        pid:
          type: integer
          format: int32
          minimum: 1
          description: |-
            Operating-system PID of the agent process to attach to. Zero and
            negative values are rejected with `400`.
          example: 12345
        context_windows:
          type: boolean
          default: false
          description: |-
            Capture LLM context windows for the session. Expensive, so off by
            default.
        categories:
          type: array
          description: |-
            Requested trace categories. Empty (the default) covers every
            category; the list is carried on the session's collect options.
          items:
            type: string
            enum: [syscall, network, file, llm_call, context_window, process, resource]
        tls_interception:
          type: boolean
          default: false
          description: Intercept TLS to detect LLM API calls.
        no_ebpf:
          type: boolean
          default: false
          description: |-
            Opt into degraded mode without kernel telemetry. When false the
            request promises eBPF and fails with `403` if it is unavailable.
      example:
        pid: 12345
        context_windows: false
        categories: [syscall, network]
        tls_interception: false
        no_ebpf: false

    SessionLifecycleSummary:
      type: object
      additionalProperties: false
      required: [id, agent_pid, agent_name, start_time, status]
      properties:
        id:
          $ref: '#/components/schemas/UUIDv7'
        agent_pid:
          type: integer
          format: int32
          description: Operating-system PID of the attached agent process.
          example: 12345
        agent_name:
          type: string
          examples: [hermes, codex, claude-code]
        command_line:
          type: string
          description: Command line of the attached process. Omitted when empty.
          example: hermes chat
        start_time:
          $ref: '#/components/schemas/RFC3339Timestamp'
        end_time:
          anyOf:
            - $ref: '#/components/schemas/RFC3339Timestamp'
            - type: 'null'
          description: Null or omitted while the session is running.
        status:
          $ref: '#/components/schemas/SessionStatus'
      description: |-
        Wire shape of `POST /api/v1/sessions/attach` (`types.SessionSummary`).
        It is flatter than `SessionSummary`: the command line is a top-level
        `command_line` field and there is no `metadata` object.
      example:
        id: 0191a000-0000-7000-8000-000000000001
        agent_pid: 12345
        agent_name: hermes
        command_line: hermes chat
        start_time: '2026-07-21T12:00:00Z'
        end_time: null
        status: running

    DetachSessionResponse:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id:
          $ref: '#/components/schemas/UUIDv7'
        status:
          $ref: '#/components/schemas/SessionStatus'
          description: Terminal status of the detached session; always `completed`.
      example:
        id: 0191a000-0000-7000-8000-000000000001
        status: completed

    ContextWindow:
      type: object
      additionalProperties: false
      required: [flow_id, timestamp, model_name, prompt_text, messages_in, messages_out, token_count, duration]
      properties:
        flow_id:
          $ref: '#/components/schemas/UUIDv7'
        timestamp:
          $ref: '#/components/schemas/RFC3339Timestamp'
        model_name:
          type: string
          example: deepseek-v4-pro
        prompt_text:
          type: string
          description: Complete system prompt visible to the model.
        messages_in:
          type: string
          description: Captured inbound message history.
        messages_out:
          type: string
          description: Captured model response.
        token_count:
          type: integer
          format: int64
          minimum: 0
        duration:
          $ref: '#/components/schemas/DurationNanoseconds'
      example:
        flow_id: 0191b000-0000-7000-8000-000000000001
        timestamp: '2026-07-21T12:00:00Z'
        model_name: deepseek-v4-pro
        prompt_text: 'You are a helpful assistant.'
        messages_in: '[{"role":"user","content":"Read auth.go"}]'
        messages_out: '[{"role":"assistant","content":"..."}]'
        token_count: 2048
        duration: 1500000000

    Flow:
      type: object
      additionalProperties: false
      required:
        - id
        - session_id
        - trace_ids
        - intent
        - phase
        - description
        - outcome
        - confidence
        - start_time
        - end_time
        - duration
        - context_window
        - metadata
      properties:
        id:
          $ref: '#/components/schemas/UUIDv7'
        session_id:
          $ref: '#/components/schemas/UUIDv7'
        trace_ids:
          type: array
          description: UUID v7 identifiers of traces grouped into this flow.
          items: {$ref: '#/components/schemas/UUIDv7'}
        intent:
          type: string
          description: |
            Classifier intent, commonly `read_file`, `patch_code`, `search_web`,
            or `llm_api_call`. Intent is intentionally open-ended.
          examples: [read_file, patch_code, search_web, llm_api_call]
        phase:
          $ref: '#/components/schemas/FlowPhase'
        description:
          type: string
          description: Human-readable description of the classified activity.
        outcome:
          $ref: '#/components/schemas/FlowOutcome'
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Classifier confidence from 0.0 through 1.0.
        start_time:
          $ref: '#/components/schemas/RFC3339Timestamp'
        end_time:
          $ref: '#/components/schemas/RFC3339Timestamp'
        duration:
          $ref: '#/components/schemas/DurationNanoseconds'
        context_window:
          anyOf:
            - $ref: '#/components/schemas/ContextWindow'
            - type: 'null'
          description: Optional LLM decision-point snapshot.
        metadata:
          type: object
          nullable: true
          description: |
            Arbitrary layer-specific JSON metadata. Null when no metadata was
            recorded for the flow.
          additionalProperties: true
      example:
        id: 0191b000-0000-7000-8000-000000000001
        session_id: 0191a000-0000-7000-8000-000000000001
        trace_ids: [0191c000-0000-7000-8000-000000000001]
        intent: read_file
        phase: action
        description: Read auth.go (247 lines, 2ms)
        outcome: success
        confidence: 0.95
        start_time: '2026-07-21T12:00:00Z'
        end_time: '2026-07-21T12:00:02Z'
        duration: 2000000000
        context_window: null
        metadata: {}

    TimeRange:
      type: object
      additionalProperties: false
      properties:
        start:
          $ref: '#/components/schemas/RFC3339Timestamp'
        end:
          $ref: '#/components/schemas/RFC3339Timestamp'
      description: Inclusive time-window filters. Both fields are optional.

    SearchRequest:
      type: object
      additionalProperties: false
      properties:
        query:
          type: string
          description: FTS5 full-text query. Empty selects structured filtering instead.
        session_id:
          $ref: '#/components/schemas/UUIDv7'
        time_range:
          $ref: '#/components/schemas/TimeRange'
        categories:
          type: array
          description: Flow phases to include.
          items: {$ref: '#/components/schemas/FlowPhase'}
        outcomes:
          type: array
          description: Flow outcomes to include.
          items: {$ref: '#/components/schemas/FlowOutcome'}
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 500
          default: 50
          description: Maximum results; zero defaults to 50 and values above 500 are capped.
        cursor:
          type: string
          description: Cursor returned by a preceding structured search.
        include_context_windows:
          type: boolean
          default: false
          description: Include optional context-window snapshots in matching flows.
      example:
        query: read auth.go
        session_id: 0191a000-0000-7000-8000-000000000001
        time_range:
          start: '2026-07-21T00:00:00Z'
          end: '2026-07-21T23:59:59Z'
        categories: [action]
        outcomes: [success, failure]
        limit: 50
        cursor: ''
        include_context_windows: false

    SearchResponse:
      type: object
      additionalProperties: false
      required: [flows, total, cursor, has_more]
      properties:
        flows:
          type: array
          items: {$ref: '#/components/schemas/Flow'}
        total:
          type: integer
          format: int32
          minimum: 0
          description: Number of flows returned by this search operation.
        cursor:
          type: string
          description: Next-page cursor, or an empty string when no next page exists.
        has_more:
          type: boolean
          description: True when `cursor` contains another-page cursor.

    ChatRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          description: Natural-language question about observed agent activity.
        session_id:
          $ref: '#/components/schemas/UUIDv7'
          description: Optional session scope for the query.

    ChatResponse:
      type: object
      additionalProperties: false
      required: [answer, flows, suggestions]
      properties:
        answer:
          type: string
          description: Natural-language answer generated from matching flows.
        flows:
          type: array
          description: Flows that support the answer.
          items: {$ref: '#/components/schemas/Flow'}
        suggestions:
          type: array
          description: Suggested follow-up natural-language questions.
          items: {type: string}
      example:
        answer: At 3am, helios read auth.go, patched server.go, and searched for rate_limit.
        flows: []
        suggestions:
          - Show all 47 results
          - Why did these failures happen?
          - What happened in the last hour?

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error detail.

    RateLimitErrorResponse:
      type: object
      additionalProperties: false
      required: [error, retry_after]
      properties:
        error:
          type: string
          description: Human-readable error detail.
        retry_after:
          type: integer
          format: int32
          minimum: 1
          description: Relative retry delay in seconds; duplicates the `Retry-After` header.

    DashboardSummary:
      type: object
      additionalProperties: false
      required: [total_flows, total_sessions, total_traces, error_count, avg_duration_ns, by_phase, by_outcome, top_intents, hourly, recent_flows]
      properties:
        total_flows:
          type: integer
          format: int64
          description: Total number of classified flows.
        total_sessions:
          type: integer
          format: int64
          description: Total number of monitored agent sessions.
        total_traces:
          type: integer
          format: int64
          description: Total number of collected traces.
        error_count:
          type: integer
          format: int64
          description: Number of flows with a `failure` or `timeout` outcome.
        avg_duration_ns:
          type: integer
          format: int64
          description: Average flow duration in nanoseconds.
        by_phase:
          type: object
          description: Flow count per classification phase.
          additionalProperties: {type: integer, format: int64}
        by_outcome:
          type: object
          description: Flow count per outcome.
          additionalProperties: {type: integer, format: int64}
        top_intents:
          type: array
          description: Most common intents, most frequent first (up to 8).
          items: {$ref: '#/components/schemas/IntentCount'}
        hourly:
          type: array
          description: Flows started per UTC hour over the last 24 hours, oldest first.
          items: {$ref: '#/components/schemas/HourlyCount'}
        recent_flows:
          type: array
          description: Most recent flows for the dashboard table preview (up to 12).
          items: {$ref: '#/components/schemas/Flow'}
      example:
        total_flows: 4711
        total_sessions: 12
        total_traces: 23108
        error_count: 37
        avg_duration_ns: 1250000000
        by_phase: {perceive: 2100, reason: 1800, act: 811}
        by_outcome: {success: 4602, failure: 33, timeout: 4, cancelled: 72}
        top_intents:
          - {intent: read_file, count: 1204}
          - {intent: patch_code, count: 892}
        hourly:
          - {hour: '2026-08-07T00:00:00Z', count: 0}
        recent_flows: []

    IntentCount:
      type: object
      additionalProperties: false
      required: [intent, count]
      properties:
        intent:
          type: string
          description: Classified intent name.
        count:
          type: integer
          format: int64
          description: Number of flows with this intent.

    HourlyCount:
      type: object
      additionalProperties: false
      required: [hour, count]
      properties:
        hour:
          $ref: '#/components/schemas/RFC3339Timestamp'
          description: UTC hour bucket start.
        count:
          type: integer
          format: int64
          description: Number of flows started in this hour.

    DaemonStats:
      type: object
      additionalProperties: false
      required: [db_path, listen_addr, total_sessions, active_sessions, total_traces, total_flows, db_size_bytes, log_level, ebpf_enabled]
      properties:
        db_path:
          type: string
          description: SQLite database file the daemon has open.
          example: /var/lib/rabbit-hole/rabbit-hole.db
        listen_addr:
          type: string
          description: |-
            Address the daemon is actually bound to. The `listen_addr` metadata
            row written by `serve` at startup wins; the server's own bound
            address is the fallback for test servers and older databases.
          example: 127.0.0.1:9734
        total_sessions:
          type: integer
          format: int64
          description: Sessions ever recorded.
        active_sessions:
          type: integer
          format: int64
          description: Stored sessions whose status is `running`.
        total_traces:
          type: integer
          format: int64
          description: Captured traces.
        total_flows:
          type: integer
          format: int64
          description: Classified flows.
        db_size_bytes:
          type: integer
          format: int64
          description: SQLite file size in bytes (pages × page size).
        oldest_trace:
          anyOf:
            - $ref: '#/components/schemas/RFC3339Timestamp'
            - type: 'null'
          description: >-
            Timestamp of the oldest stored trace, as stored (RFC 3339 with the
            database's local UTC offset). Omitted when there are no traces.
        log_level:
          type: string
          description: |-
            Daemon log level (`debug`, `info`, `warn`, `error`). Empty when the
            `serve` command registered no runtime info.
          examples: [info]
        ebpf_enabled:
          type: boolean
          description: Kernel probes are active in this daemon.
        ebpf_detail:
          type: string
          description: Why eBPF is disabled, when it is. Omitted otherwise.
          example: 'eBPF degraded — telemetry DISABLED'
      example:
        db_path: /var/lib/rabbit-hole/rabbit-hole.db
        listen_addr: 127.0.0.1:9734
        total_sessions: 12
        active_sessions: 2
        total_traces: 23108
        total_flows: 4711
        db_size_bytes: 52428800
        oldest_trace: '2026-07-01T09:12:44Z'
        log_level: info
        ebpf_enabled: true

    CompactRequest:
      type: object
      additionalProperties: false
      required: [cutoff]
      properties:
        cutoff:
          type: string
          format: date-time
          description: |-
            RFC3339 timestamp; everything older is deleted. The CLI resolves
            its `--older-than` duration into this value before calling.
          example: '2026-08-01T00:00:00Z'

    CompactResponse:
      type: object
      additionalProperties: false
      required: [cutoff]
      properties:
        cutoff:
          type: string
          format: date-time
          description: The applied cutoff, normalized to UTC and re-formatted as RFC3339.
      example:
        cutoff: '2026-08-01T00:00:00Z'

    DemoSeedRequest:
      type: object
      additionalProperties: false
      properties:
        flows:
          type: integer
          format: int32
          minimum: 0
          default: 48
          description: Flows to generate. Zero or negative applies the default of 48.
          example: 48
        hours_back:
          type: integer
          format: int32
          minimum: 0
          default: 3
          description: |-
            Hours before now to start the session. Zero or negative applies the
            default of 3.
          example: 3
        spread:
          type: boolean
          default: false
          description: |-
            Distribute flows across the whole `hours_back` window instead of
            clustering them at its start.
      example:
        flows: 48
        hours_back: 3
        spread: true

    DemoSeedResponse:
      type: object
      additionalProperties: false
      required: [session_id]
      properties:
        session_id:
          $ref: '#/components/schemas/UUIDv7'
          description: ID of the seeded session, already finalized to `completed`.
      example:
        session_id: 0191a000-0000-7000-8000-000000000001

x-cors:
  description: Middleware handles OPTIONS for every path before route dispatch.
  allowOrigin: '*'
  allowMethods: [GET, POST, OPTIONS]
  allowHeaders: [Content-Type, X-Request-ID]
  preflightStatus: 204
x-api-notes:
  - All responses receive `X-Request-ID`; callers may supply it to correlate a request.
  - Endpoint-level rate limiting is a per-IP, per-endpoint token bucket for search, chat, and WebSocket upgrades.
  - WebSocket flow data uses the same Flow schema as GET /api/v1/flows/{id}.
  - The daemon-scoped routes (`GET /api/v1/stats`, `POST /api/v1/compact`, `POST /api/v1/demo/seed`, and the session lifecycle endpoints) report and mutate the daemon's own store; the CLI never opens the SQLite file itself.
