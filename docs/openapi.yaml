openapi: 3.1.0
info:
  title: Rabbit-Hole Expression Server API
  version: 1.0.0
  summary: REST, Prometheus, and WebSocket interfaces for agent-expression data.
  description: |
    Rabbit-Hole turns collected agent telemetry into classified, human-readable
    flows. This OpenAPI contract documents the expression server described in
    specs/04-Expression-Layer.md (S04 — Expression Layer).

    The expression layer serves health and observability data, session and flow
    retrieval, structured search, natural-language chat, and real-time flow
    delivery. It is the final layer in the collect → classify → express pipeline.

    API-key security is opt-in. When RABBITHOLE_API_KEY is configured, every
    operation except the two Prometheus scrape endpoints requires X-API-Key.
    When it is not configured, requests are accepted without the header.
  contact:
    name: Rabbit-Hole maintainers
    url: https://gitlab.readydedis.com/rabbit-hole/rabbit-hole
  x-rabbit-hole-spec: specs/04-Expression-Layer.md
  x-rabbit-hole-example-theme:
    name: rabbit-hole-dark
    background: '#0d1117'
    surface: '#161b22'
    foreground: '#c9d1d9'
    accent: '#58a6ff'
    success: '#3fb950'
    warning: '#d29922'
    error: '#f85149'
servers:
  - url: http://127.0.0.1:9734
    description: Default local server address.
  - url: https://{host}
    description: Example reverse-proxy deployment.
    variables:
      host:
        default: rabbit-hole.example.internal
tags:
  - name: Health
    description: Server and component health.
  - name: Metrics
    description: Prometheus observability scrapes.
  - name: Sessions
    description: Monitored agent sessions.
  - name: Flows
    description: Classified semantic flows and context windows.
  - name: Search
    description: Structured flow discovery.
  - name: Chat
    description: Natural-language agent activity queries.
  - name: Streaming
    description: Real-time flow streaming over WebSocket.
security:
  - ApiKeyAuth: []
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Health check
      description: |
        Reports uptime and the health of storage, metrics, and registered
        components. A degraded component is represented in the response body;
        the handler still returns HTTP 200 while it remains reachable.
      responses:
        '200':
          description: Health response from the expression server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                ok:
                  value:
                    status: ok
                    version: 1.0.0
                    uptime: 3h24m18.402s
                    components:
                      storage:
                        status: ok
                      metrics:
                        status: ok
                        detail: runtime gauges active
                degraded:
                  value:
                    status: degraded
                    version: 1.0.0
                    uptime: 47m2.991s
                    components:
                      storage:
                        status: error
                        detail: database is locked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /metrics:
    get:
      tags: [Metrics]
      operationId: getMetrics
      summary: Prometheus metrics
      description: |
        Returns the Prometheus text exposition from the dedicated server
        registry. This endpoint always bypasses API-key authentication and
        rate limiting so monitoring systems can scrape it independently.
      security: []
      responses:
        '200':
          description: Prometheus text exposition.
          content:
            'text/plain; version=0.0.4; charset=utf-8':
              schema:
                type: string
              example: |
                # HELP rabbit_hole_uptime_seconds Seconds since server start.
                # TYPE rabbit_hole_uptime_seconds gauge
                rabbit_hole_uptime_seconds 204.123
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/metrics:
    get:
      tags: [Metrics]
      operationId: getVersionedMetrics
      summary: Prometheus metrics through the versioned API path
      description: |
        This versioned alias uses the same Prometheus handler as GET /metrics.
        It always bypasses API-key authentication and rate limiting.
      security: []
      responses:
        '200':
          description: Prometheus text exposition from the shared handler.
          content:
            'text/plain; version=0.0.4; charset=utf-8':
              schema:
                type: string
              example: |
                # TYPE rabbit_hole_goroutines gauge
                rabbit_hole_goroutines 23
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/sessions:
    get:
      tags: [Sessions]
      operationId: listSessions
      summary: List monitored sessions
      description: |
        Lists compact session summaries using offset pagination. The default
        limit is 20; the server caps the applied limit at 100.
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/SessionListLimit'
      responses:
        '200':
          description: Page of monitored session summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSessionsResponse'
              example:
                sessions:
                  - id: 0191a35c-71af-7d91-b77a-790c47b8815e
                    agent_pid: 12345
                    agent_name: hermes
                    start_time: '2026-07-12T03:00:00Z'
                    end_time: null
                    status: running
                total: 1
                offset: 0
                limit: 20
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/sessions/{id}:
    get:
      tags: [Sessions]
      operationId: getSession
      summary: Get session
      description: Returns a complete monitored session including process metadata.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Requested session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                id: 0191a35c-71af-7d91-b77a-790c47b8815e
                agent_pid: 12345
                agent_name: codex
                start_time: '2026-07-12T03:00:00Z'
                end_time: '2026-07-12T03:43:16Z'
                status: completed
                metadata:
                  command_line: codex exec --full-auto
                  environment:
                    HOME: /home/kara
                  work_dir: /srv/project
                  binary_path: /usr/local/bin/codex
                  version: 1.0.0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/flows/{id}:
    get:
      tags: [Flows]
      operationId: getFlow
      summary: Get flow
      description: Retrieves one classified semantic unit of agent activity.
      parameters:
        - $ref: '#/components/parameters/FlowId'
      responses:
        '200':
          description: Requested classified flow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flow'
              example:
                id: 0191a4e4-c9d7-7c32-a508-3dc2d18bcfed
                session_id: 0191a35c-71af-7d91-b77a-790c47b8815e
                trace_ids: [0191a4dc-12e1-7f47-a574-749ae3af1cf9]
                intent: patch_code
                phase: action
                description: Patched middleware.go to validate API keys.
                outcome: success
                confidence: 0.97
                start_time: '2026-07-12T03:12:24Z'
                end_time: '2026-07-12T03:12:24.154Z'
                duration: 154ms
                metadata:
                  files_changed: 1
                  lines_added: 12
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/FlowNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/flows/{id}/context-window:
    get:
      tags: [Flows]
      operationId: getContextWindow
      summary: Get context window
      description: |
        Retrieves the optional model-context capture for a decision flow.
        Context capture is disabled by default, so an existing flow can return
        404 when no context window was recorded.
      parameters:
        - $ref: '#/components/parameters/FlowId'
      responses:
        '200':
          description: Context window captured for the flow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextWindow'
              example:
                flow_id: 0191a4e4-c9d7-7c32-a508-3dc2d18bcfed
                timestamp: '2026-07-12T03:12:24.102Z'
                model_name: deepseek-v4-pro
                prompt_text: You are a coding agent. Fix the middleware bug.
                messages_in: Review the API-key middleware and find the defect.
                messages_out: The header check needs a constant-time comparison.
                token_count: 1258
                duration: 821ms
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ContextWindowNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/search:
    post:
      tags: [Search]
      operationId: searchFlows
      summary: Search flows
      description: |
        Searches stored flows by full-text query or structured filters. The
        handler applies a 30-second deadline. Search is rate limited per client
        IP when rate limiting is enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            example:
              query: patch middleware
              session_id: 0191a35c-71af-7d91-b77a-790c47b8815e
              time_range:
                start: '2026-07-12T00:00:00Z'
                end: '2026-07-12T23:59:59Z'
              categories: [action]
              outcomes: [success]
              limit: 50
              cursor: ''
              include_context_windows: true
      responses:
        '200':
          description: Matching flows and cursor-pagination state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
              example:
                flows: []
                total: 0
                cursor: ''
                has_more: false
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '504':
          $ref: '#/components/responses/SearchTimedOut'
  /api/v1/chat:
    post:
      tags: [Chat]
      operationId: chatAboutFlows
      summary: Chat about agent activity
      description: |
        Translates a natural-language question to a flow search, then returns
        an answer, supporting flows, and suggested follow-up questions. Empty
        messages are rejected. Chat is rate limited per client IP when enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
            example:
              message: What did helios do at 3am?
              session_id: 0191a35c-71af-7d91-b77a-790c47b8815e
      responses:
        '200':
          description: Answer and supporting classified flows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
              example:
                answer: At 3 AM, Helios identified and patched the API-key middleware.
                flows: []
                suggestions:
                  - Show me the context window when it patched middleware.go.
                  - What happened in the next hour?
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/ws/sessions/{id}:
    get:
      tags: [Streaming]
      operationId: streamSessionFlows
      summary: Stream real-time flows over WebSocket
      description: |
        Upgrades the request to a WebSocket. Every server text frame contains a
        JSON-encoded Flow. The server pings every 30 seconds and closes normally
        when the stream ends. Include X-API-Key in the upgrade request when
        RABBITHOLE_API_KEY is configured. Upgrade attempts are rate limited.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/WebSocketUpgrade'
        - $ref: '#/components/parameters/WebSocketConnection'
        - $ref: '#/components/parameters/WebSocketVersion'
        - $ref: '#/components/parameters/WebSocketKey'
      responses:
        '101':
          description: |
            WebSocket upgrade accepted. Subsequent JSON text frames conform to
            Flow. The server returns Upgrade websocket and Connection Upgrade.
          headers:
            Upgrade:
              schema:
                type: string
                const: websocket
            Connection:
              schema:
                type: string
                const: Upgrade
        '400':
          description: WebSocket upgrade request is malformed or unsupported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: 'websocket: the client is not using the websocket protocol'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Required when RABBITHOLE_API_KEY is configured. It is harmless when
        opt-in authentication is disabled. Metrics operations opt out explicitly.
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      description: UUIDv7 identifier of the monitored session.
      schema:
        $ref: '#/components/schemas/Identifier'
      example: 0191a35c-71af-7d91-b77a-790c47b8815e
    FlowId:
      name: id
      in: path
      required: true
      description: UUIDv7 identifier of the classified flow.
      schema:
        $ref: '#/components/schemas/Identifier'
      example: 0191a4e4-c9d7-7c32-a508-3dc2d18bcfed
    Offset:
      name: offset
      in: query
      required: false
      description: Zero-based number of session summaries to skip.
      schema:
        type: integer
        minimum: 0
        default: 0
    SessionListLimit:
      name: limit
      in: query
      required: false
      description: Maximum session summaries; default 20 and maximum 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    WebSocketUpgrade:
      name: Upgrade
      in: header
      required: true
      description: Requests RFC 6455 protocol upgrade.
      schema:
        type: string
        const: websocket
    WebSocketConnection:
      name: Connection
      in: header
      required: true
      description: Connection directive containing Upgrade.
      schema:
        type: string
        example: Upgrade
    WebSocketVersion:
      name: Sec-WebSocket-Version
      in: header
      required: true
      description: WebSocket version supported by the client.
      schema:
        type: string
        const: '13'
    WebSocketKey:
      name: Sec-WebSocket-Key
      in: header
      required: true
      description: Client-generated base64 nonce for the handshake.
      schema:
        type: string
        minLength: 16
  responses:
    InvalidRequest:
      description: Invalid JSON request body or missing required field.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidJson:
              value:
                error: 'invalid request body: unexpected EOF'
            missingMessage:
              value:
                error: message is required
    Unauthorized:
      description: API key is missing or does not match the configured key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: unauthorized
    SessionNotFound:
      description: No monitored session exists for the requested identifier.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: session not found
    FlowNotFound:
      description: No classified flow exists for the requested identifier.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: flow not found
    ContextWindowNotFound:
      description: No context window was captured for the requested flow.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: context window not available — may not have been captured
    RateLimited:
      description: Endpoint-specific token bucket is exhausted for this client.
      headers:
        Retry-After:
          description: Number of seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
          example: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitError'
          example:
            error: rate limit exceeded
            retry_after: 1
    SearchTimedOut:
      description: Search exceeded the expression server 30-second deadline.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: search timed out — try narrowing your query
    InternalServerError:
      description: Unexpected server, storage, search, or chat-model failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: internal server error
  schemas:
    Identifier:
      type: string
      format: uuid
      description: Rabbit-Hole UUIDv7 identifier.
      examples:
        - 0191a35c-71af-7d91-b77a-790c47b8815e
    HealthResponse:
      type: object
      required: [status, version, uptime, components]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: Overall status; degraded if any probe reports an error.
        version:
          type: string
          description: Expression server version string.
          example: 1.0.0
        uptime:
          type: string
          description: Go duration string since server creation.
          example: 3h24m18.402s
        components:
          type: object
          description: Component names mapped to probe results.
          additionalProperties:
            $ref: '#/components/schemas/ComponentStatus'
    ComponentStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, error]
        detail:
          type: string
          description: Optional human-readable health detail or failure reason.
    ListSessionsResponse:
      type: object
      required: [sessions, total, offset, limit]
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionSummary'
        total:
          type: integer
          minimum: 0
          description: Number of summaries returned in this response page.
        offset:
          type: integer
          minimum: 0
          description: Applied offset.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Applied limit after server validation.
    SessionSummary:
      type: object
      required: [id, agent_pid, agent_name, start_time, status]
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        agent_pid:
          type: integer
          format: int32
          minimum: 1
          description: Operating-system PID of the observed process.
        agent_name:
          type: string
          description: Detected or configured agent name.
          example: hermes
        start_time:
          type: string
          format: date-time
        end_time:
          type: [string, 'null']
          format: date-time
          description: Null while the agent session is running.
        status:
          $ref: '#/components/schemas/SessionStatus'
    Session:
      type: object
      required: [id, agent_pid, agent_name, start_time, status, metadata]
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        agent_pid:
          type: integer
          format: int32
          minimum: 1
        agent_name:
          type: string
          example: codex
        start_time:
          type: string
          format: date-time
        end_time:
          type: [string, 'null']
          format: date-time
          description: Null when the monitored process remains active.
        status:
          $ref: '#/components/schemas/SessionStatus'
        metadata:
          $ref: '#/components/schemas/SessionMetadata'
    SessionStatus:
      type: string
      description: Lifecycle state of a monitored agent process.
      enum: [running, completed, crashed, killed]
    SessionMetadata:
      type: object
      required: [command_line, environment, work_dir, binary_path, version]
      properties:
        command_line:
          type: string
          description: Full process command line captured at session creation.
          example: hermes chat --model gpt-5.6-terra
        environment:
          type: object
          description: Sanitized process environment captured for the session.
          additionalProperties:
            type: string
        work_dir:
          type: string
          description: Agent working directory.
          example: /srv/rabbit-hole
        binary_path:
          type: string
          description: Path to the observed executable.
          example: /usr/local/bin/hermes
        version:
          type: string
          description: Detected agent version when available.
          example: 1.0.0
    SearchRequest:
      type: object
      description: |
        Structured query for matching flows. A non-empty query is used for
        full-text search. An empty query permits filter-only search. Limit 0
        defaults to 50; values greater than 500 are capped by the server.
      properties:
        query:
          type: string
          description: Natural-language or structured full-text query.
          example: patch middleware
        session_id:
          $ref: '#/components/schemas/Identifier'
        time_range:
          $ref: '#/components/schemas/TimeRange'
        categories:
          type: array
          description: Restrict results to selected flow phases.
          items:
            $ref: '#/components/schemas/FlowPhase'
          uniqueItems: true
        outcomes:
          type: array
          description: Restrict results to selected flow outcomes.
          items:
            $ref: '#/components/schemas/FlowOutcome'
          uniqueItems: true
        limit:
          type: integer
          minimum: 0
          maximum: 500
          default: 50
          description: Maximum returned results; 0 uses the server default.
        cursor:
          type: string
          description: Opaque cursor returned by an earlier structured search.
        include_context_windows:
          type: boolean
          default: false
          description: Include optional captured context windows with flows.
    SearchResponse:
      type: object
      required: [flows, total, cursor, has_more]
      properties:
        flows:
          type: array
          description: Flows that match the request.
          items:
            $ref: '#/components/schemas/Flow'
        total:
          type: integer
          minimum: 0
          description: Number of flows returned in this response.
        cursor:
          type: string
          description: Opaque next-page cursor; empty when no next page exists.
        has_more:
          type: boolean
          description: True when cursor can be used for a further page.
    ChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          description: Natural-language question about agent activity.
          example: What did helios do at 3am?
        session_id:
          $ref: '#/components/schemas/Identifier'
    ChatResponse:
      type: object
      required: [answer, flows, suggestions]
      properties:
        answer:
          type: string
          description: Natural-language answer generated from matching flows.
        flows:
          type: array
          description: Supporting classified flows used to formulate the answer.
          items:
            $ref: '#/components/schemas/Flow'
        suggestions:
          type: array
          description: Suggested natural-language follow-up questions.
          items:
            type: string
    Flow:
      type: object
      required:
        - id
        - session_id
        - trace_ids
        - intent
        - phase
        - description
        - outcome
        - confidence
        - start_time
        - end_time
        - duration
        - metadata
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        session_id:
          $ref: '#/components/schemas/Identifier'
        trace_ids:
          type: array
          description: Trace event identifiers classified into this flow.
          items:
            $ref: '#/components/schemas/Identifier'
          minItems: 1
        intent:
          type: string
          description: Semantic action inferred by the classifier.
          examples: [read_file, patch_code, search_web, llm_api_call]
        phase:
          $ref: '#/components/schemas/FlowPhase'
        description:
          type: string
          description: Human-readable flow narrative.
          example: Read auth.go (74 lines, 2ms).
        outcome:
          $ref: '#/components/schemas/FlowOutcome'
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Classifier confidence in the inferred semantic flow.
        start_time:
          type: string
          format: date-time
          description: Time of the first trace in this flow.
        end_time:
          type: string
          format: date-time
          description: Time of the final trace in this flow.
        duration:
          type: string
          description: Go duration string for total flow duration.
          example: 154ms
        context_window:
          oneOf:
            - $ref: '#/components/schemas/ContextWindow'
            - type: 'null'
          description: Optional model context captured at the decision point.
        metadata:
          type: object
          description: Layer-specific metadata retained with this flow.
          additionalProperties: true
          example:
            files_changed: 1
            lines_added: 12
    FlowPhase:
      type: string
      description: Stage of the agent decision cycle.
      enum: [observation, deliberation, action, verification]
    FlowOutcome:
      type: string
      description: Result of the classified flow.
      enum: [success, failure, timeout, unknown]
    ContextWindow:
      type: object
      required:
        - flow_id
        - timestamp
        - model_name
        - prompt_text
        - messages_in
        - messages_out
        - token_count
        - duration
      properties:
