# Rabbit-Hole — GitLab CI Pipeline
# Agent legibility platform. Go 1.26+.

image: golang:1.26

stages:
  - build
  - vet
  - test
  - vulncheck

variables:
  GOFLAGS: "-ldflags=-s -w"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"

cache:
  paths:
    - .cache/go-build/
    - .cache/go-mod/

before_script:
  - mkdir -p .cache/go-build .cache/go-mod
  - go version
  - go env

build:
  stage: build
  script:
    # Inject build metadata so `rabbit-hole version` and GET /health
    # report the real version/commit/date of this build (DF-021).
    # Shallow clones without tags fall back to v0.0.0-<sha>.
    - VERSION=$(git describe --tags 2>/dev/null || printf 'v0.0.0-%s' "$(git rev-parse --short HEAD 2>/dev/null)")
    - COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)
    - BUILD_DATE=$(git log -1 --format=%cd --date=iso-strict 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ)
    - export GOFLAGS="-ldflags=-s -w -X main.Version=$VERSION -X main.Commit=$COMMIT -X main.BuildTime=$BUILD_DATE"
    - go build -o bin/rabbit-hole ./cmd/rabbit-hole/
    - file bin/rabbit-hole
  artifacts:
    paths:
      - bin/rabbit-hole
    expire_in: 1 day

vet:
  stage: vet
  script:
    - go vet ./...

test:
  stage: test
  script:
    - go test ./... -count=1 -short -race
  coverage: '/^coverage: (\d+\.\d+)% of statements/'

vulncheck:
  stage: vulncheck
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    - govulncheck ./...
  allow_failure: true
